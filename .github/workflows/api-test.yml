name: API Testing

on:
  push:
    branches: [ main ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Newman
        run: npm install -g newman

      - name: Start API server
        run: |
          node server.js &
          sleep 5

      - name: Run Postman tests
        run: newman run student-api.postman_collection.json
